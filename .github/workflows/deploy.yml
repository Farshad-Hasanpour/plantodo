name: Deploy to production via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up PHP and Node.js
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, fileinfo, curl, openssl
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # Install Node.js dependencies and build
      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      - name: Make upload directories
        run: |
          cp -r public upload-public

          UPLOAD_DIR="upload-private"
          mkdir "$UPLOAD_DIR"

          # Copy directories
          for dir in app bootstrap config resources routes storage vendor; do
          cp -r "$dir" "$UPLOAD_DIR/$dir"
          done

          # Copy individual files
          mkdir -p "$UPLOAD_DIR/public/build"
          cp public/build/manifest.json "$UPLOAD_DIR/public/build/manifest.json"
          cp .env "$UPLOAD_DIR/.env"
          cp artisan "$UPLOAD_DIR/artisan"

      - name: Upload public files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-public
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}

      - name: Upload private files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-private
          server-dir: ${{ secrets.FTP_PRIVATE_DIR }}
