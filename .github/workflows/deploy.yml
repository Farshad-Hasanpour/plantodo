name: Deploy to production via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Install Node.js dependencies and build
      - name: Install NPM dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, fileinfo, curl, openssl
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build assets (Vite)
        run: npm run build

      - name: Make upload directory
        run: npm run deploy:prepare:repo

      - name: Upload public files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload/public/
          server-dir: ${{ secrets.SERVER_PUBLIC_DIR }}

      - name: Upload private files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload/private/
          server-dir: ${{ secrets.SERVER_PRIVATE_DIR }}

      - name: Check if Composer files have changed
        id: composer-check
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'composer\.json|composer\.lock'; then
            echo "composer_changed=true" >> $GITHUB_OUTPUT
          else
            echo "composer_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload vendor directory (only if composer files changed)
        if: steps.composer-check.outputs.composer_changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload/vendor/
          server-dir: ${{ secrets.SERVER_PRIVATE_DIR }}vendor/
